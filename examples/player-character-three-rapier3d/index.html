<!doctype html>
<html>
  <head>
    <meta charset='utf-8'>
    <title>GG example</title>
    <meta name='viewport' content='width=device-width,initial-scale=1'>
  </head>
  <body>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
    <canvas id='gg'></canvas>
    <div style='position: absolute; top: 0.5rem; left: 0.5rem; padding: 0.5rem 0.75rem; background: rgba(0, 0, 0, 0.5); color: white; font-family: monospace; font-size: 0.75rem; line-height: 1.4; border-radius: 4px; pointer-events: none;'>
      WASD / Arrows - move<br>
      Shift - run<br>
      Ctrl - crouch<br>
      Space - jump<br>
      Mouse - look (click to lock pointer)<br>
      V - toggle first/third person
    </div>
  </body>
</html>
