<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GG example</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
  </head>
  <body>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }

      /* A screen's UI is plain DOM inside its layer. */
      .panel {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        color: #eee;
      }

      .panel--menu {
        background: #1b2333;
      }

      /* The pause screen lets the frozen game show through. */
      .panel--pause {
        background: rgba(10, 14, 22, 0.7);
      }

      .panel h1 {
        margin: 0 0 8px;
        font-size: 32px;
        font-weight: 600;
      }

      .panel p {
        margin: 0;
        color: #9aa7bd;
        font-size: 14px;
      }

      .panel .error {
        color: #ff8a80;
      }

      .panel button {
        min-width: 200px;
        padding: 12px 24px;
        border: 1px solid #55627a;
        border-radius: 6px;
        background: #2b3650;
        color: inherit;
        font: inherit;
        font-size: 16px;
        cursor: pointer;
      }

      .panel button:hover {
        background: #37456a;
      }

      .hint {
        position: absolute;
        left: 12px;
        bottom: 12px;
        color: #fff;
        font-size: 13px;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
    </style>
  </body>
</html>
