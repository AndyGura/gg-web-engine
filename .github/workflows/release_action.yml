name: Release new version

on:
  push:
    branches:
      - main

jobs:
  release-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get commit message
        id: get_commit_message
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=format:"%s")
          echo "commit_message=$COMMIT_MESSAGE" >> $GITHUB_ENV

      - name: Extract version string
        id: extract_version
        run: |
          if [[ "$commit_message" =~ ^\[pre-release\]\ \[([0-9]+\.[0-9]+\.[0-9]+)\] ]]; then
            VERSION="${BASH_REMATCH[1]}"
            echo "version=$VERSION" >> $GITHUB_ENV
            echo "PRE_RELEASE=true" >> $GITHUB_ENV
          else
            echo "Commit message does not match the pre-release pattern, exiting..."
            echo "PRE_RELEASE=false" >> $GITHUB_ENV
            exit 0
          fi

      - name: Setup python
        if: env.PRE_RELEASE == 'true'
        uses: getsentry/action-setup-venv@v2.1.1
        with:
          python-version: 3.10.7
          cache-dependency-path: ./documentation/requirements.txt
          install-cmd: pip install -r ./documentation/requirements.txt
          venv-dir: ./documentation/.venv

      - name: Set up Node.js
        if: env.PRE_RELEASE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish
        if: env.PRE_RELEASE == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_KEY }}
        run: |
          chmod +x ./etc/publish_new_version.sh
          export NODE_AUTH_TOKEN=${{ secrets.NPM_KEY }}
          ./etc/publish_new_version.sh ${{ env.version }}

      - name: Update docs
        if: env.PRE_RELEASE == 'true'
        run: |
          npm i
          npm run generate
        working-directory: ./documentation

      - name: Update version in git
        if: env.PRE_RELEASE == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '${{ env.version }} release'
          tagging_message: ${{ env.version }}

      - name: Deploy to GitHub Pages
        if: env.PRE_RELEASE == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./documentation/site
          # Preserve blender-extensions/ (published by the steps below, in the same job)
          # instead of wiping it out.
          keep_files: true

      # The Blender add-on (blender-addon/) rides along on every engine release rather than
      # needing its own separate tag - it keeps its own version number in
      # blender_manifest.toml (bump that yourself when blender-addon/ actually changes; this
      # step doesn't bump it for you), but publishing runs unconditionally here. Re-publishing
      # an unchanged version is a harmless no-op for users already on it - Blender's Get
      # Extensions UI just won't show a new update. See blender-addon/README.md.
      - name: Install Blender (builder only, headless)
        if: env.PRE_RELEASE == 'true'
        run: |
          BUILDER_BLENDER_VERSION=4.2.1
          curl -fsSL -o /tmp/blender.tar.xz \
            "https://download.blender.org/release/Blender${BUILDER_BLENDER_VERSION%.*}/blender-${BUILDER_BLENDER_VERSION}-linux-x64.tar.xz"
          mkdir -p /opt/blender
          tar -xf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          echo "/opt/blender" >> "$GITHUB_PATH"

      - name: Build Blender add-on extension zip
        if: env.PRE_RELEASE == 'true'
        working-directory: ./blender-addon
        run: |
          chmod +x ./tools/package.sh
          ./tools/package.sh

      - name: Fetch existing self-hosted Blender extensions repo contents (if any)
        if: env.PRE_RELEASE == 'true'
        run: |
          mkdir -p /tmp/blender-extensions-repo
          git clone --depth 1 --branch gh-pages "https://github.com/${{ github.repository }}.git" /tmp/gh-pages-checkout 2>/dev/null || true
          if [ -d /tmp/gh-pages-checkout/blender-extensions ]; then
            # Copy over every previously published zip (not just the old index.json, which
            # server-generate below rebuilds from scratch anyway) so past versions stay
            # installable/rollback-able instead of getting silently dropped on every release.
            cp -r /tmp/gh-pages-checkout/blender-extensions/. /tmp/blender-extensions-repo/
          fi

      - name: Regenerate self-hosted Blender extensions repository index
        if: env.PRE_RELEASE == 'true'
        run: |
          cp blender-addon/dist/*.zip /tmp/blender-extensions-repo/
          blender --command extension server-generate --repo-dir=/tmp/blender-extensions-repo

      - name: Deploy Blender add-on to GitHub Pages (blender-extensions/ subfolder only)
        if: env.PRE_RELEASE == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/blender-extensions-repo
          destination_dir: blender-extensions
          keep_files: true
