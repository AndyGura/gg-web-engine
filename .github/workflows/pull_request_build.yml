name: Unit tests
on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review, unlabeled]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Installs and links the packages/* npm workspace in one shot: every adapter resolves
      # @gg-web-engine/core to the local packages/core build below instead of the version pinned
      # in its package.json, so PR changes to core are exercised by every adapter's real test
      # suite. See gg-engine-core-development.
      - name: Install workspace dependencies
        run: npm install

      - name: Build and test core
        working-directory: ./packages/core
        run: npm run build && npm run test

      - name: Build and test ammo
        working-directory: ./packages/ammo
        run: npm run build && npm run test

      - name: Build and test matter
        working-directory: ./packages/matter
        run: npm run build && npm run test

      - name: Build pixi
        working-directory: ./packages/pixi
        run: npm run build

      - name: Build and test rapier2d
        working-directory: ./packages/rapier2d
        run: npm run build && npm run test

      - name: Build and test rapier3d
        working-directory: ./packages/rapier3d
        run: npm run build && npm run test

      - name: Build three
        working-directory: ./packages/three
        run: npm run build
