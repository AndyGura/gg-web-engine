name: Unit tests
on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review, unlabeled]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      # Installs and links the packages/* npm workspace in one shot: every adapter resolves
      # @gg-web-engine/core to the local packages/core build below instead of the version pinned
      # in its package.json, so PR changes to core are exercised by every adapter's real test
      # suite. See gg-engine-core-development.
      - name: Install workspace dependencies
        run: npm install

      - name: Build all packages
        run: npm run build

      - name: Test all packages
        run: npm run test

      # Gzipped size of every package and starter template, shown in the job summary so a PR that
      # grows a bundle is visible. The README table is rewritten from the same script at release.
      - name: Measure bundle sizes
        run: npm run bundle-sizes

      # Examples are the engine's tutorials: they must not import three/pixi.js/ammo.js/matter-js/
      # @dimforge directly or use an adapter's native* escape hatch. See gg-engine-examples.
      - name: Check examples use engine APIs only
        run: npm run lint:examples

      # Starter templates pin the last published engine version; build each one against this PR's
      # packages instead, so a change that breaks a template fails here, not after a release.
      - name: Build starter templates against the local packages
        run: |
          for template in templates/*/; do
            bash etc/switch_example_to_local_gg.sh "$template"
            (cd "$template" && npm run build)
          done

      # packages/core/AGENTS.md ships in the core tarball and is generated from the
      # gg-engine-app-development skill; a skill edit without a regenerated AGENTS.md fails here.
      - name: Check AGENTS.md matches the app-development skill
        run: npm run check:agents-md
